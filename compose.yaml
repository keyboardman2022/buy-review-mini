services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buy_before
      POSTGRES_USER: buy_before
      POSTGRES_PASSWORD: local_buy_before_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - buy_before_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buy_before -d buy_before"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  buy_before_pg:
